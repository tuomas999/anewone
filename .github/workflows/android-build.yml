name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project layout
        shell: bash
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/parking_lots.json.gz
          test -f ci_patches/MainActivity.kt.gz.b64

      - name: Restore verified MainActivity
        shell: bash
        run: |
          base64 --decode ci_patches/MainActivity.kt.gz.b64 | gzip -dc > app/src/main/java/ge/mindia/parkpilot/MainActivity.kt
          test "$(wc -c < app/src/main/java/ge/mindia/parkpilot/MainActivity.kt)" -eq 24884
          echo "80453103f92a750491d8ea92c34a4ede6f967fdf0b9f2925dd851001c39a0d90  app/src/main/java/ge/mindia/parkpilot/MainActivity.kt" | sha256sum -c -

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace testDebugUnitTest |& tee unit-tests.log

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug |& tee build.log

      - name: Rename APK
        if: success()
        run: cp app/build/outputs/apk/debug/app-debug.apk ParkPilot-0.3.2-debug.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ParkPilot-0.3.2-debug-apk
          path: ParkPilot-0.3.2-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ParkPilot-build-diagnostics
          path: |
            unit-tests.log
            build.log
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore
          retention-days: 14
