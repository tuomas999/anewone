name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify ParkPilot source
        shell: bash
        run: |
          cat ci_parts/part*.b64 > ParkPilot_ci_min.b64
          base64 --decode ParkPilot_ci_min.b64 > ParkPilot_ci_min.zip
          echo "c5d55e5c4a35a0bd8cd2fc020f2416a31278f0353281df64bb39a8280520637d  ParkPilot_ci_min.zip" | sha256sum -c -
          unzip -q ParkPilot_ci_min.zip
          test -f ParkPilot/settings.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: ParkPilot/**/*.gradle.kts

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Validate parking asset
        working-directory: ParkPilot
        run: python3 tools/validate_asset.py

      - name: Unit tests
        working-directory: ParkPilot
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK
        working-directory: ParkPilot
        run: gradle --no-daemon --stacktrace assembleDebug |& tee build.log

      - name: Rename APK
        if: success()
        run: cp ParkPilot/app/build/outputs/apk/debug/app-debug.apk ParkPilot-0.3.2-debug.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ParkPilot-0.3.2-debug-apk
          path: ParkPilot-0.3.2-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ParkPilot-build-diagnostics
          path: |
            ParkPilot/build.log
            ParkPilot/app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore
          retention-days: 14
